name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sme-growth-twin

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sme-growth-twin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Stage 07 golden cases
        run: npm run test:stage07:golden

      - name: Stage 07 security boundary
        run: npm run test:stage07:security

      - name: Production dependency audit
        run: npm run audit:production

      - name: Build
        run: npm run build

      - name: Phase 6 video source invariants
        run: node ../video-production/majupilot-hackathon-video/scripts/verify-phase6.mjs --checked
